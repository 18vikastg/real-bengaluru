name: probe
on:
  push:
    branches: [fmt-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write . > /dev/null; git diff
      - run: pnpm lint || true
      - run: pnpm typecheck || true
      - run: pnpm test || true
