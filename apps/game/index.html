<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rowdy Journey — an open-world Bengaluru in your browser</title>
    <meta
      name="description"
      content="An original open-world browser game set in a stylised Bengaluru. Drive autos, dodge traffic, soak in the city."
    />
    <meta name="author" content="Vikas T G" />
    <meta name="theme-color" content="#0d0f14" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230d0f14'/><path d='M6 21h20v-5l-4-7H11l-5 6z' fill='%23f5c518'/><circle cx='11' cy='22' r='3' fill='%231f9d55'/><circle cx='22' cy='22' r='3' fill='%231f9d55'/></svg>"
    />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #0d0f14;
      }
      /* Instant boot shell: visible before any JavaScript arrives. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 12px;
        text-align: center;
        color: #e9e6df;
        font-family: system-ui, sans-serif;
      }
      #boot b {
        font-size: 28px;
        letter-spacing: 0.02em;
      }
      #boot span {
        font-size: 13px;
        opacity: 0.6;
      }
      #boot i {
        width: 160px;
        height: 3px;
        margin: 8px auto 0;
        border-radius: 3px;
        overflow: hidden;
        background: #23262e;
        position: relative;
      }
      #boot i::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        background: #f5c518;
        animation: boot 1.1s ease-in-out infinite alternate;
      }
      @keyframes boot {
        to {
          transform: translateX(150%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <b>Rowdy Journey</b>
        <span>Warming up the engine… Created &amp; developed by Vikas T G</span>
        <i></i>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
